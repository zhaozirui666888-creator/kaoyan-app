<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="mobile-web-app-capable" content="yes"><title>考研作息</title>
<style>
:root{--bg:#f5f5f7;--card:rgba(255,255,255,.78);--solid:#fff;--text:#1c1c1e;--muted:#8e8e93;--line:rgba(60,60,67,.16);--accent:#6c8278;--accent-soft:#e8efeb;--orange:#c9935c;--danger:#c96868;--shadow:0 12px 35px rgba(0,0,0,.07);--glass:blur(22px)}
:root.dark{--bg:#111113;--card:rgba(29,29,31,.82);--solid:#1c1c1e;--text:#f5f5f7;--muted:#98989f;--line:rgba(235,235,245,.16);--accent:#89a59a;--accent-soft:#26332e;--orange:#d9a36d;--danger:#ff8585;--shadow:0 14px 35px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer;color:inherit}button:active{transform:scale(.97)}.app{max-width:1120px;margin:auto;padding:18px 16px 80px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}.brand{font-size:24px;font-weight:760;letter-spacing:-.5px}.sub{font-size:13px;color:var(--muted);margin-top:3px}.top-actions{display:flex;gap:8px}.iconbtn,.btn{background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 13px;box-shadow:0 3px 14px rgba(0,0,0,.03)}.btn.primary{background:var(--accent);color:white;border-color:transparent}.btn.danger{color:var(--danger)}
.hero{background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.date-click{border:0;background:none;padding:0;text-align:left;color:inherit}.date{font-size:15px;color:var(--muted)}.countdown{font-size:34px;font-weight:800;margin-top:3px;letter-spacing:-1px}.countdown span{font-size:14px;font-weight:500;color:var(--muted)}
.kpi-row{display:grid;grid-template-columns:1.25fr .9fr .9fr;gap:10px;margin-top:18px}.kpi{background:rgba(120,120,128,.08);border-radius:18px;padding:13px;min-height:92px}.kpi b{display:block;font-size:22px;line-height:1.2}.kpi small{color:var(--muted);display:block;margin-top:5px}.ringbox{display:flex;align-items:center;gap:12px}.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0deg,rgba(120,120,128,.16) 0deg)}.ring:after{content:"";width:48px;height:48px;border-radius:50%;background:var(--solid);grid-area:1/1}.ring span{grid-area:1/1;z-index:1;font-size:14px;font-weight:750}.compare{font-size:12px;color:var(--muted);margin-top:5px}.compare.up{color:var(--accent)}.compare.down{color:var(--danger)}
.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0 8px;padding:2px}.tab{padding:9px 14px;border-radius:12px;background:transparent;color:var(--muted);white-space:nowrap}.tab.active{background:var(--text);color:var(--solid)}.daynav{display:flex;align-items:center;justify-content:center;gap:9px;margin:9px 0 13px}.daynav button{background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 12px}.daynav .date-click{font-weight:700;min-width:190px;text-align:center}.daynav .today{font-size:12px;color:var(--muted);padding:7px 8px}
.view{animation:viewIn .25s ease}.layout{display:grid;grid-template-columns:1.4fr .78fr;gap:12px}.panel{background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 5px 22px rgba(0,0,0,.035)}.panel h2{font-size:17px;margin:0 0 14px}.panel h3{font-size:14px;margin:0 0 7px}
.task{display:grid;grid-template-columns:70px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);transition:.2s}.task:last-child{border-bottom:0}.task.completed{opacity:.58}.task.completed h3{text-decoration:line-through}.time{font-size:13px;color:var(--muted);padding-top:3px}.task-main{min-width:0}.task-main h3{margin:0 0 5px;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{display:inline-flex;font-size:11px;background:var(--accent-soft);border-radius:999px;padding:4px 8px;color:var(--accent)}.tag.no{background:rgba(120,120,128,.1);color:var(--muted)}.task-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}.check{width:28px;height:28px;border-radius:50%;background:rgba(120,120,128,.11);display:grid;place-items:center;font-size:15px}.check.done{background:var(--accent);color:white}.task-actions{display:flex;gap:5px;align-items:flex-start}.mini{background:transparent;color:var(--muted);padding:5px 7px;border-radius:8px}.mini:hover{background:rgba(120,120,128,.1)}.actual{font-weight:650;color:var(--text)}.over{color:var(--orange)}.note{font-size:12px;color:var(--muted);margin-top:7px}.restday{background:rgba(120,120,128,.08);border-radius:16px;padding:11px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.restday b{font-size:14px}.restday span{font-size:12px;color:var(--muted)}
.summary-list{display:grid;gap:10px}.summary-row{display:flex;justify-content:space-between;gap:12px;font-size:13px}.summary-row span{color:var(--muted)}.write-note{width:100%;margin-top:14px;padding:13px 15px;border-radius:15px;background:var(--text);color:var(--solid);font-weight:700}.sticky{background:#fff4c9;color:#554d36;padding:16px;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.08);transform:rotate(-1deg);min-height:100px;white-space:pre-wrap;overflow-wrap:anywhere}.dark .sticky{background:#4a452e;color:#f5edc7}
.data-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.switch{display:flex;gap:5px;background:rgba(120,120,128,.08);padding:4px;border-radius:12px}.switch button{background:transparent;padding:7px 10px;border-radius:9px;color:var(--muted)}.switch button.active{background:var(--solid);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.06)}.data-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.data-kpis>div{padding:12px;border-radius:14px;background:rgba(120,120,128,.08)}.data-kpis b{display:block;font-size:19px}.data-kpis span{font-size:11px;color:var(--muted)}.chartbox{height:260px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 8px 28px}.bars{height:100%;display:flex;align-items:end;gap:7px}.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}.bar-stack{width:min(38px,72%);border-radius:8px 8px 3px 3px;overflow:hidden;display:flex;flex-direction:column-reverse;background:rgba(120,120,128,.08)}.bar-seg{width:100%;min-height:0}.bar-label{font-size:10px;color:var(--muted);margin-top:6px;white-space:nowrap}.bar-val{font-size:10px;color:var(--muted);height:17px}.pie-wrap{display:flex;gap:20px;align-items:center}.pie{width:170px;height:170px;border-radius:50%;flex:none;background:rgba(120,120,128,.1)}.legend{flex:1}.legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;margin:9px 0;font-size:13px}.legend-row i{width:10px;height:10px;border-radius:50%}.legend-row small{grid-column:2/4;color:var(--muted);font-size:11px}.drill{margin-top:14px;border-top:1px solid var(--line);padding-top:13px}.drill-row{padding:9px 0;border-bottom:1px solid var(--line)}.drill-row summary{cursor:pointer;font-size:13px}.drill-dates{padding:8px 0 0 14px;color:var(--muted);font-size:12px;display:grid;gap:5px}
.period-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.period-nav button{background:rgba(120,120,128,.08);border-radius:11px;padding:7px 11px}.period-title{font-weight:700}.notes-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sticky-card{min-height:130px;padding:16px;border-radius:3px;background:#fff4c9;box-shadow:0 8px 18px rgba(0,0,0,.08);position:relative}.sticky-card:nth-child(2n){transform:rotate(1.2deg)}.sticky-card:nth-child(3n){transform:rotate(-1.1deg)}.sticky-card h4{margin:0 0 8px;font-size:13px}.sticky-card p{margin:0;font-size:13px;line-height:1.55;white-space:pre-wrap}.sticky-card.empty{opacity:.45}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.week-day{padding:10px;border-radius:14px;background:rgba(120,120,128,.08);min-height:120px}.week-day b{font-size:12px}.week-day .wcount{font-size:11px;color:var(--muted);margin-top:6px}.week-day .dot{height:4px;border-radius:5px;background:var(--accent);margin-top:8px}
.template-day{border:1px solid var(--line);border-radius:15px;padding:12px;margin:8px 0}.template-day summary{cursor:pointer;font-weight:700}.tpl-task{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.tpl-task:last-child{border-bottom:0}.template-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.seg{display:flex;background:rgba(120,120,128,.08);border-radius:12px;padding:4px}.seg button{padding:7px 10px;background:transparent;border-radius:9px;color:var(--muted)}.seg button.active{background:var(--solid);color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .24s ease;z-index:50}.modal.show{opacity:1;pointer-events:auto}.dialog{width:min(680px,100%);max-height:88vh;overflow:auto;background:var(--solid);border-radius:25px 25px 0 0;padding:17px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -15px 45px rgba(0,0,0,.16);transform:translateY(24px);transition:transform .28s cubic-bezier(.22,.8,.25,1)}.modal.show .dialog{transform:translateY(0)}.grab{width:38px;height:5px;border-radius:99px;background:rgba(120,120,128,.28);margin:0 auto 14px}.dialog h2{font-size:19px;margin:0 0 14px}.form{display:grid;gap:12px}.form label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(120,120,128,.07);color:var(--text);outline:none}.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.form input[type=time]:active,.form input[type=time]:focus{background:var(--accent-soft)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switchline{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.toggle{width:48px;height:29px;border-radius:20px;background:#d1d1d6;padding:3px}.toggle i{display:block;width:23px;height:23px;background:white;border-radius:50%;transition:.2s}.toggle.on{background:var(--accent)}.toggle.on i{transform:translateX(19px)}.duration-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.duration-btn{padding:13px 8px;border-radius:13px;background:rgba(120,120,128,.08);font-weight:700;border:1px solid transparent;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}.duration-btn:hover{background:var(--accent-soft)}.duration-btn:active{transform:scale(.96)}.duration-btn.active{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(108,130,120,.24)}.stars-picker{display:flex;justify-content:center;gap:8px;margin:13px 0}.star-btn{font-size:31px;background:transparent;color:#c9c9ce;transition:.15s}.star-btn.on{color:var(--orange);transform:scale(1.08)}.duration-btn:focus-visible,.star-btn:focus-visible,.cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.footer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--solid) 22%);padding-top:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head{font-size:11px;color:var(--muted);text-align:center;padding:5px}.cal-day{padding:9px 2px;border-radius:10px;background:transparent;text-align:center}.cal-day.muted{opacity:.4}.cal-day.sel{background:var(--accent);color:white}.cal-day:hover{background:var(--accent-soft)}.calendar-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.calendar-nav button{background:rgba(120,120,128,.08);border-radius:10px;padding:7px 10px}.subject-list{display:grid;gap:7px}.subject-item{display:flex;align-items:center;justify-content:space-between;padding:10px 11px;background:rgba(120,120,128,.07);border-radius:12px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:rgba(28,28,30,.92);color:white;padding:10px 14px;border-radius:13px;opacity:0;pointer-events:none;transition:.22s;z-index:80;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes viewIn{from{opacity:.55;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:800px){.app{padding:12px 11px 70px}.layout{grid-template-columns:1fr}.kpi-row{grid-template-columns:1fr 1fr}.kpi:first-child{grid-column:1/-1}.notes-wall{grid-template-columns:1fr 1fr}.week-grid{grid-template-columns:repeat(2,1fr)}.hero{border-radius:22px}.task{grid-template-columns:58px 1fr}.task-actions{grid-column:2}.task-main h3{white-space:normal}.pie-wrap{flex-direction:column;align-items:flex-start}.pie{width:145px;height:145px}.data-kpis{grid-template-columns:repeat(3,1fr)}.duration-grid{grid-template-columns:repeat(2,1fr)}.daynav .date-click{min-width:145px}.dialog{max-height:92vh}.notes-wall .sticky-card:nth-child(n){transform:none}.calendar{gap:3px}}
</style></head>
<body><div class="app">
<header><div><div class="brand">考研作息</div><div class="sub">把今天过好，就是最稳的上岸节奏。</div></div><div class="top-actions"><button class="iconbtn" onclick="openSettings()">⚙︎</button><button class="btn" id="authBtn" onclick="openAuth()">登录</button></div></header>
<section class="hero"><div class="hero-row"><button class="date-click" onclick="openCalendar()"><div class="date" id="dateText"></div><div class="countdown" id="countdown">— <span>天</span></div><div class="sub">距离目标考试日期</div></button><button class="btn primary" onclick="openTask()">＋ 添加任务</button></div>
<div class="kpi-row"><div class="kpi ringbox"><div class="ring" id="ring"><span id="rate">0%</span></div><div><b id="doneCount">0 / 0</b><small>今日完成率</small></div></div><div class="kpi"><b id="hours">0h</b><small>实际学习</small><div class="compare" id="compare">与昨天相同</div></div><div class="kpi"><b id="avg">0.0 ⭐</b><small>平均自评</small></div></div></section>
<div class="tabs"><button class="tab active" onclick="showView('today',this)">今日</button><button class="tab" onclick="showView('data',this)">数据中心</button><button class="tab" onclick="showView('templates',this)">作息模板</button></div>
<div class="daynav"><button onclick="navigate(-1)">‹</button><button class="date-click" id="dayLabel" onclick="openCalendar()"></button><button onclick="navigate(1)">›</button><button class="today" onclick="goToday()">今天</button></div>
<main id="todayView" class="view"><div class="layout"><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>今日作息</h2><button class="mini" onclick="toggleRestDay()" id="restBtn">今日休息日</button></div><div id="restBanner"></div><div id="taskList"></div></section><aside class="panel"><h2>今日总结</h2><div id="summary"></div><div id="stickyPreview"></div><button class="write-note" onclick="openNoteSheet()">✎ 写今日心得</button></aside></div></main>
<main id="dataView" class="view" style="display:none"><div id="dataContent"></div></main>
<main id="templatesView" class="view" style="display:none"><div id="templatesContent"></div></main>
</div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div>
<script src="v2.js"></script></body></html>
